[workspace]
resolver = "2"
members = [
    "compiler",
    "runtime",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pickle-foundation/picklescript"

[profile.release]
opt-level = 3
debug = false
# pickle-runtime is also built without std (--features nostd), which has no
# unwinding panic machinery; the panic hook still runs before abort.
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"